appId: com.leanote.desktop
productName: Leanote
copyright: Copyright (c) Leanote

directories:
  buildResources: build

files:
  - main.js
  - note.html
  - login.html
  - "src/**/*"
  - "public/**/*"
  - "data/**/*"
  - "!dev/**"
  - "!docs/**"
  - "!tests/**"
  - "!.git/**"
  - "!*.md"
  - "!preview.png"
  - "!build/**"

asar: true

linux:
  target:
    - target: deb
      arch:
        - x64
  category: Office
  icon: build/icons
  artifactName: Leanote-${version}-linux-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/images/ico/app.ico
  artifactName: Leanote-${version}-win-${arch}-setup.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/images/logo/leanote.png
  category: public.app-category.productivity
  artifactName: Leanote-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/images/ico/app.ico
  uninstallerIcon: public/images/ico/app.ico
  installerHeaderIcon: public/images/ico/app.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Leanote
