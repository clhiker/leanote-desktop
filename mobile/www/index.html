<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Leanote</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <div class="brand">
            <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2z"/>
                    <path d="M20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2z"/>
                </svg>
            </span>
            <div>
                <h1>Leanote</h1>
                <p class="subtitle">连接你的笔记服务器</p>
            </div>
        </div>

        <form id="server-form" novalidate>
            <label for="server">服务器地址</label>
            <input id="server" name="server" type="url" inputmode="url" autocomplete="url"
                   spellcheck="false" placeholder="https://leanote.com 或 https://host/leanote">
            <p id="error" class="error" role="alert" hidden></p>
            <button id="open" class="primary" type="submit">打开 Leanote</button>
        </form>

        <section id="recent" class="recent" hidden>
            <div class="recent-title">最近使用</div>
            <ul id="recent-list"></ul>
        </section>

        <button id="forget" class="link" type="button" hidden>清除已保存的服务器</button>
        <p class="hint">移动端打开的是 Leanote server 网页版，请确认服务器地址可访问。</p>
    </main>

    <script src="config.generated.js"></script>
    <script type="module" src="app.mjs"></script>
</body>
</html>
